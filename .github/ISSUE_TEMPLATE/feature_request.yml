name: "💡 Feature Request"
description: "Suggest an idea or enhancement for sol-flame"
title: "[Feature]: "
labels: ["enhancement"]
body:
  - type: markdown
    attributes:
      value: |
        We appreciate suggestions for new profiling features, SVM runtime integrations, or flamegraph visualizations.
  - type: textarea
    id: problem
    attributes:
      label: Problem or Pain Point
      description: Is your feature request related to a specific challenge when optimizing Solana programs?
    validations:
      required: true
  - type: textarea
    id: solution
    attributes:
      label: Proposed Solution / Feature
      description: Describe the solution or capability you would like to see added.
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives Considered
      description: Any alternative tools or workarounds you have considered.
    validations:
      required: false
