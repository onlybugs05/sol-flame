name: "🐛 Bug Report"
description: "File an issue about unexpected behavior or errors in sol-flame"
title: "[Bug]: "
labels: ["bug", "triage"]
body:
  - type: markdown
    attributes:
      value: |
        Thank you for reporting a problem in `sol-flame`! Please provide details to help us diagnose and fix the issue quickly.
  - type: textarea
    id: description
    attributes:
      label: Description of the Bug
      description: A clear and concise description of what went wrong.
    validations:
      required: true
  - type: textarea
    id: reproduction
    attributes:
      label: Steps to Reproduce
      description: Steps or commands to reproduce the issue.
      placeholder: |
        1. Run `cargo cu-flame ...`
        2. Inspect output
        3. See error
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected Behavior
      description: What did you expect to happen instead?
    validations:
      required: true
  - type: textarea
    id: environment
    attributes:
      label: Environment & Versions
      description: Operating System, Rust version, Solana CLI version, and crate version.
      placeholder: |
        - OS: Ubuntu 24.04 / macOS 14 / Windows
        - Rust: rustc 1.75+
        - sol-flame: 0.1.0
    validations:
      required: true
