[package]
name = "cargo-cu-flame"
version.workspace = true
edition.workspace = true
authors.workspace = true
license.workspace = true
description = "CLI tool and Cargo subcommand for Solana Compute Unit & memory flamegraph profiling"

[lib]
name = "cargo_cu_flame"
path = "src/lib.rs"

[[bin]]
name = "cargo-cu-flame"
path = "src/main.rs"

[[bin]]
name = "sol-flame"
path = "src/bin/sol-flame.rs"

[dependencies]
sol-flame-core = { workspace = true }
sol-flame-render = { workspace = true }
sol-flame-mollusk = { workspace = true }
clap.workspace = true
serde.workspace = true
serde_json.workspace = true

